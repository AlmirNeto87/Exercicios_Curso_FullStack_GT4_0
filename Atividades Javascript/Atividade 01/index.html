<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 01 - Javascript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <input type="text" id="buscaTitulo" onkeyup="pesquisarTarefas()" placeholder="pesquisar por Titulo">
        <input type="text" id="buscaDescricao" onkeyup="pesquisarDescricao()" placeholder="pesquisar por Descricao">
    </header>

    <main>
        <section id="tarefas">
            <h2>Tarefas <button onclick="abrirModal()">Nova Tarefa</button></h2>
            
            <ul id="lista">
                
            </ul>
            
        </section>
        <section id="overlay" onclick="fecharModal()"></section>
        <div id="criarTarefa" class="modal">
            <form onsubmit="novaTarefa()">
                <h3> Criar Tarefa <box-icon name='x' size="md" onclick="fecharModal()"></box-icon></h3>
                <label for="titulo">Titulo</label>
                <input type="text" id="titulo" required>
                <label for="data">Data e horário:</label>
                <input type="datetime-local" id="data">
                <label for="descricao">Descricao</label>
                <textarea id="descricao" required></textarea>
                <button>Criar</button>
            </form>

        </div>
    </main>

    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>

    <script src="index.js"></script>
</body>
</html>
